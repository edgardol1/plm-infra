name: Hardening CI/CD & OPA

on:
  workflow_dispatch:
    inputs:
      projectId:
        description: "GCP Project ID"
        required: true
        type: string
      dryRun:
        description: "No subir artefactos (solo probar)"
        required: true
        type: boolean
        default: true
      commands:
        description: "Comandos a ejecutar en la carpeta terraform"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ====== AUTENTICACIÓN WIF (siempre que haya projectId) ======
      - name: Auth (WIF)
        if: ${{ inputs.projectId != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account:          ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id:               ${{ inputs.projectId }}

      - name: Setup gcloud
        if: ${{ inputs.projectId != '' }}
        uses: google-github-actions/setup-gcloud@v2

      # ====== TERRAFORM ======
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # ====== TFSEC (arreglo: descarga directa del .tar.gz correcto) ======
      - name: Install tfsec
        run: |
          set -euo pipefail
          TMP=/tmp/tfsec.tgz
          curl -sSLf -o "$TMP" \
            https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64.tar.gz
          sudo tar -xzf "$TMP" -C /usr/local/bin tfsec
          tfsec --version

      # ====== CONFTEST (descarga directa) ======
      - name: Install conftest
        run: |
          set -euo pipefail
          CT=/tmp/conftest.tgz
          curl -sSLf -o "$CT" \
            https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
          sudo tar -xzf "$CT" -C /usr/local/bin conftest
          conftest --version

      # ====== TUS COMANDOS ======
      - name: Run commands
        run: ${{ inputs.commands }}

      # ====== ARTEFACTOS (solo si no es dryRun) ======
      - name: Upload artifacts
        if: ${{ always() && !inputs.dryRun }}
        uses: actions/upload-artifact@v4
        with:
          name: tf-artifacts
          if-no-files-found: warn
          path: |
            terraform/tfplan.bin
            terraform/plan.json
            tfplan.bin
            plan.json
