name: Hardening CI/CD & OPA

on:
  workflow_dispatch:
    inputs:
      projectId:
        description: "GCP Project ID"
        required: true
        type: string
      dryRun:
        description: "No subir artefactos (solo probar)"
        required: true
        type: boolean
        default: true
      commands:
        description: "Comandos a ejecutar en la carpeta terraform"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      # ===== WIF Auth (usa tus secrets) =====
      - name: Auth (WIF)
        if: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ inputs.projectId }}

      - name: Setup gcloud
        if: ${{ success() && secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v2

      # ===== Terraform =====
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # ===== tfsec (instalación tolerante a 404) =====
      - name: Install tfsec (tolerant)
        run: |
          set -euo pipefail
          OS=linux
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=amd64 ;;
          esac

          URL1="https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-${OS}-${ARCH}.tar.gz"
          URL2="https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-${OS}-amd64.tar.gz"

          echo "Descargando tfsec…"
          if ! curl -fsSL "$URL1" -o tfsec.tgz; then
            echo "URL1 falló/404, probando URL2…"
            if ! curl -fsSL "$URL2" -o tfsec.tgz; then
              echo "No se pudo descargar tfsec; continuo sin tfs
