name: Hardening CI/CD & OPA
on:
  workflow_dispatch:
    inputs:
      projectId: {required: true, type: string}
      dryRun:    {required: true, type: boolean}
      commands:  {required: true, type: string}
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - name: Auth (WIF)
        if: ${{ env.GCP_WIF_PROVIDER != '' && env.GCP_SA_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ env.GCP_WIF_PROVIDER != '' && env.GCP_SA_EMAIL != '' }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.7.5 }
      - name: Install tfsec
        run: curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | sh
      - name: Install conftest
        run: |
          v=0.56.0
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v${v}/conftest_${v}_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
      - name: Export ENV
        run: |
          echo "PROJECT_ID=${{ inputs.projectId }}" >> $GITHUB_ENV
          echo "DRY_RUN=${{ inputs.dryRun }}" >> $GITHUB_ENV
      - name: Write commands
        run: printf "%s\n" "${{ inputs.commands }}" > .commands.txt
      - name: Runner
        run: |
          set -euo pipefail
          while IFS= read -r line; do [ -z "$line" ] && continue; echo ">>> $line"; bash -lc "$line"; done < .commands.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-plan-and-policy
          path: |
            terraform/tfplan.bin
            terraform/plan.json
          if-no-files-found: warn
