name: Hardening CI/CD & OPA

on:
  workflow_dispatch:
    inputs:
      projectId: { required: true, type: string }
      dryRun:    { required: true, type: boolean }
      commands:  { required: true, type: string }

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      # (Opcional) Auth WIF si ya tienes provider y SA en secrets
      - name: Auth (WIF)
        if: ${{ false }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # FIX: instalar tfsec con bash + tar.gz
      - name: Install tfsec
        shell: bash
        run: |
          set -e
          curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64.tar.gz -o tfsec.tgz
          tar -xzf tfsec.tgz
          sudo mv tfsec /usr/local/bin/tfsec
          tfsec --version

      # FIX: instalar conftest
      - name: Install conftest
        shell: bash
        run: |
          set -e
          curl -sSL https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz -o conftest.tgz
          sudo tar -xzf conftest.tgz -C /usr/local/bin conftest
          conftest --version

      # Ejecuta los comandos suministrados en el dispatch
      - name: Run commands
        run: ${{ inputs.commands }}

      # Subir artefactos sin romper por paths
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-artifacts
          path: |
            terraform/tfplan.bin
            terraform/plan.json
            tfplan.bin
            plan.json
          if-no-files-found: warn
