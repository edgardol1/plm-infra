name: Hardening CI/CD & OPA

on:
  workflow_dispatch:
    inputs:
      projectId:
        required: true
        type: string
      dryRun:
        required: true
        type: boolean
      commands:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      # Auth GCP via WIF (usa tus secrets)
      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.projectId }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # tfsec por tar.gz (evita fallo con sh)
      - name: Install tfsec
        run: |
          set -e
          curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64.tar.gz -o tfsec.tgz
          tar -xzf tfsec.tgz
          sudo mv tfsec /usr/local/bin/tfsec
          tfsec --version

      # conftest por tar.gz
      - name: Install conftest
        run: |
          set -e
          curl -sSL https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz -o conftest.tgz
          sudo tar -xzf conftest.tgz -C /usr/local/bin conftest
          conftest --version

      # Ejecuta lo que envíes desde "Run workflow"
      - name: Run commands
        run: ${{ inputs.commands }}

      # Artefactos (acepta rutas con o sin prefijo)
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-artifacts
          if-no-files-found: warn
          path: |
            terraform/tfplan.bin
            terraform/plan.json
            tfplan.bin
            plan.json
